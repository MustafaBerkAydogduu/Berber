<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="#0D0E11"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#E5C578" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Luxury Scissor Motif -->
  <g transform="translate(12, 10)">
    <!-- Scissor Blades -->
    <path d="M10 8 L30 32 M30 8 L10 32" stroke="#E5C578" stroke-width="2.75" stroke-linecap="round"/>
    
    <!-- Pivot Gold Dot -->
    <circle cx="20" cy="20" r="3" fill="#0D0E11" stroke="#E5C578" stroke-width="2"/>
    
    <!-- Scissor Finger Loops -->
    <circle cx="9" cy="35" r="5" stroke="#E5C578" stroke-width="2.25" fill="#0D0E11"/>
    <circle cx="31" cy="35" r="5" stroke="#E5C578" stroke-width="2.25" fill="#0D0E11"/>
    
    <!-- Little Star on Top -->
    <path d="M20 2 L21.5 6 L25.5 6.5 L22.5 9.5 L23.5 13.5 L20 11.5 L16.5 13.5 L17.5 9.5 L14.5 6.5 L18.5 6 Z" fill="#E5C578"/>
  </g>
</svg>
